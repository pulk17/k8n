name: Release

# Tag a commit (v0.1.0) and this builds the single-file binaries and attaches
# them to the release. The frontend is exported as static files and embedded in
# the Go binary, so each artifact is the whole app — no Node, no Docker.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install web dependencies
        run: npm ci

      - name: Export the frontend
        working-directory: apps/web
        env:
          K8N_EXPORT: "1"
        run: npm run build:site

      - name: Stage it for embedding
        run: |
          rm -rf apps/api/ui
          cp -r apps/web/out apps/api/ui

      - name: Test
        working-directory: apps/api
        run: go test ./...

      - name: Build every target
        working-directory: apps/api
        run: |
          mkdir -p ../../dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -tags embedui -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../../dist/k8n-$os-$arch$ext" .
            # The stdio MCP server, for AI clients that spawn it directly.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../../dist/k8n-mcp-$os-$arch$ext" ./cmd/k8n-mcp
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum k8n-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **New here? Follow the setup guide: https://k8n.pages.dev/setup/** — Docker, a local cluster, this download, and connecting the website, step by step.

            Download the binary for your system and run it. It prints two links: one opens k8n
            straight from your machine, the other opens https://k8n.pages.dev connected to it.

            | System | File |
            |---|---|
            | Windows | `k8n-windows-amd64.exe` |
            | macOS, Apple Silicon | `k8n-darwin-arm64` |
            | macOS, Intel | `k8n-darwin-amd64` |
            | Linux | `k8n-linux-amd64`, `k8n-linux-arm64` |

            `k8n-mcp-*` is the stdio MCP server, for AI clients that start it themselves.
            `SHA256SUMS.txt` has a checksum for every file.

            macOS and Windows will warn that the binary is unsigned: this project has no
            code-signing certificate. The setup guide shows how to get past that, or build from source.
