name: Site

# Publishes k8n.pages.dev after CI passes on main, from the files CI tested —
# nothing is rebuilt here. Cloudflare Pages hosts static files for free, with
# no build minutes used by a direct upload.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: a Cloudflare API token
# with the "Account → Cloudflare Pages → Edit" permission. Without it this
# says so and stops, rather than failing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: site
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 89204a58082e62654e740d317a9603f2
  PROJECT: k8n

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was not published. See .github/workflows/site.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the site CI tested
        if: steps.token.outputs.ready == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # A manual run has no CI run to take files from, so it builds them.
      - uses: actions/checkout@v7
        if: steps.token.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v7
        if: steps.token.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        with:
          node-version: "22"
          cache: npm
      - name: Build the site
        if: steps.token.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        env:
          K8N_EXPORT: "1"
        run: |
          npm ci
          (cd apps/web && npm run build:site)
          mv apps/web/out site

      # Run from an empty directory: wrangler otherwise inspects the project
      # it is started in and tries to turn a Next.js app into a Worker.
      - name: Publish to Cloudflare Pages
        if: steps.token.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          site="$PWD/site"
          cd "$RUNNER_TEMP"
          npx --yes wrangler@4 pages deploy "$site" --project-name "$PROJECT" --branch main --commit-hash "$SHA"
