services:
  db:
    image: postgres:15
    container_name: k8n_db
    environment:
      POSTGRES_USER: k8n
      POSTGRES_PASSWORD: k8npassword
      POSTGRES_DB: k8n_db
    ports:
      - "5432:5432"
    volumes:
      - k8n_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  k8n_pgdata:
