# ============================================
# k8n Nginx Reverse Proxy
# ============================================
# Single entry point:
#   /api/*, /mcp/*, /health -> Go API (port 8080)
#   everything else         -> Next.js frontend (port 3000)

upstream api {
    server api:8080;
}

upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # YAML manifests can be large.
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # The assistant streams its turn over SSE, which dies if nginx buffers.
        proxy_buffering off;
        proxy_cache off;
    }

    # MCP over streamable HTTP.
    location /mcp {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://api;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
