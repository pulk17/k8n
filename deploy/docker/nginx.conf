# ============================================
# k8n Nginx Reverse Proxy
# ============================================
# Routes all traffic through a single port (80/443)
# /api/* -> Go API (port 8080)
# /*     -> Next.js frontend (port 3000)

upstream api {
    server api:8080;
}

upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Increase body size for YAML/JSON payloads
    client_max_body_size 10M;

    # API routes
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Health check (API)
    location /health {
        proxy_pass http://api;
        proxy_read_timeout 10s;
    }

    # Legacy K8s/Helm check endpoints
    location /k8s/ {
        proxy_pass http://api;
        proxy_read_timeout 10s;
    }

    location /helm/ {
        proxy_pass http://api;
        proxy_read_timeout 10s;
    }

    # WebSocket support (if needed later)
    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Frontend (catch-all)
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
